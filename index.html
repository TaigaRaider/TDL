<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Todo</title>
  </head>
  <body>
    <div id="app">
      <header>
        <h6 style="color: var(--color-muted-foreground)">WORKSPACE</h6>
        <h1 style="color: var(--color-foreground); margin-top: 0">
          Your tasks
        </h1>
      </header>

      <div class="dashboard">
        <div class="dashboard-item" id="all">
          <p class="dashboard-item-count">5</p>
          <span class="dashboard-item-tag">All</span>
        </div>

        <div class="dashboard-item" id="pending">
          <p class="dashboard-item-count">4</p>
          <span class="dashboard-item-tag">Pending</span>
        </div>

        <div class="dashboard-item" id="completed">
          <p class="dashboard-item-count">1</p>
          <span class="dashboard-item-tag">Completed</span>
        </div>
      </div>
      <div class="input_fi">
        <input id="input-task" type="text" placeholder="Add a new task..." />
        <button id="add-task">Add task</button>
      </div>
      <section class="todo-section">
        <div class="section-filter">
          <button class="filter-btn" id="filter-all">All</button>
          <button class="filter-btn" id="filter-pending">Pending</button>
          <button class="filter-btn" id="filter-completed">Completed</button>
        </div>

        <ul class="todo-list">
          <li class="todo-item">
            <input id="task1" type="checkbox" value="Task Completed" />
            <label for="task1" id="task1-label">
              Draft the upload.init endpoint spec
            </label>
            <button class="delete-button">
              <i class="fa-duotone fa-solid fa-trash"></i>
            </button>
          </li>
          <li class="todo-item">
            <input id="task2" type="checkbox" value="Task Completed" />
            <label for="task2" id="task2-label">
              Add HMAC verification to webhook route
            </label>
            <button class="delete-button">
              <i class="fa-duotone fa-solid fa-trash"></i>
            </button>
          </li>
          <li class="todo-item">
            <input id="task3" type="checkbox" value="Task Completed" />
            <label for="task3" id="task3-label">
              Write migration for upload_sessions table
            </label>
            <button class="delete-button">
              <i class="fa-duotone fa-solid fa-trash"></i>
            </button>
          </li>
          <li class="todo-item">
            <input id="task4" type="checkbox" value="Task Completed" />
            <label for="task4" id="task4-label"> Steal the moon </label>
            <button class="delete-button">
              <i class="fa-duotone fa-solid fa-trash"></i>
            </button>
          </li>
          <li class="todo-item">
            <input checked id="task5" type="checkbox" value="Task Completed" />
            <label for="task5" id="task5-label">
              Scaffold the Hono upload service
            </label>
            <button class="delete-button">
              <i class="fa-duotone fa-solid fa-trash"></i>
            </button>
          </li>
        </ul>
      </section>
    </div>

    <script src="todo.js"></script>
    <script src="main.js"></script>
  </body>
</html>
